name: Build PC exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller mss pillow winocr deep-translator
      - run: pyinstaller --onefile --name AltyaziPC --collect-all winocr --collect-submodules winrt --collect-submodules winsdk pc/altyazi_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: altyazi-pc-exe
          path: dist/AltyaziPC.exe
